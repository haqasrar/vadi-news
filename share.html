<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAj1lPZymdb6jSPrf8ZSfBIIlvc-7JqLho",
            authDomain: "vadi-e-kashmir.firebaseapp.com",
            projectId: "vadi-e-kashmir",
            storageBucket: "vadi-e-kashmir.firebasestorage.app",
            messagingSenderId: "330323093016",
            appId: "1:330323093016:web:a4204fac189bf119b5c56d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function getMeta() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            if (id) {
                const docRef = doc(db, "news", id);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    // Set the tags WhatsApp sees
                    document.title = data.title;
                    document.querySelector('meta[property="og:title"]').setAttribute("content", data.title);
                    document.querySelector('meta[property="og:image"]').setAttribute("content", data.img);
                    document.querySelector('meta[property="og:description"]').setAttribute("content", data.desc.substring(0, 100));
                    
                    // Redirect to the actual article on your main site
                    window.location.href = `index.html?id=${id}`;
                }
            } else {
                window.location.href = "index.html";
            }
        }
        getMeta();
    </script>
    
    <meta property="og:type" content="article">
    <meta property="og:title" content="Vadi E Kashmir">
    <meta property="og:description" content="Latest News Updates">
    <meta property="og:image" content="https://vediekashmir.netlify.app/images/Logo.png">
</head>
<body>
    <p>Redirecting to Vadi E Kashmir...</p>
</body>
</html>
