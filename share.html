<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vadi E Kashmir</title>

    <meta property="og:type" content="article">
    <meta property="og:title" id="og-title" content="Vadi E Kashmir">
    <meta property="og:description" id="og-desc" content="Read the full story on Vadi E Kashmir.">
    <meta property="og:image" id="og-img" content="https://vediekashmir.netlify.app/images/Logo.png">
    <meta property="og:url" id="og-url" content="https://vediekashmir.netlify.app/">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAj1lPZymdb6jSPrf8ZSfBIIlvc-7JqLho",
            authDomain: "vadi-e-kashmir.firebaseapp.com",
            projectId: "vadi-e-kashmir",
            storageBucket: "vadi-e-kashmir.firebasestorage.app",
            messagingSenderId: "330323093016",
            appId: "1:330323093016:web:a4204fac189bf119b5c56d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function fetchMetadata() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');

            if (id) {
                const docRef = doc(db, "news", id);
                const snap = await getDoc(docRef);

                if (snap.exists()) {
                    const data = snap.data();
                    
                    // Update meta tags dynamically for the crawler
                    document.title = data.title;
                    document.getElementById('og-title').setAttribute("content", data.title);
                    
                    // Grabs specific news image from Firebase
                    document.getElementById('og-img').setAttribute("content", data.img); 
                    document.getElementById('og-desc').setAttribute("content", data.desc.substring(0, 150) + "...");
                    
                    // Redirect to index.html after the crawler has a chance to read the tags
                    setTimeout(() => {
                        window.location.href = `index.html?id=${id}`;
                    }, 800); 
                } else {
                    window.location.href = "index.html";
                }
            } else {
                window.location.href = "index.html";
            }
        }
        fetchMetadata();
    </script>
</head>
<body>
    <div style="text-align:center; margin-top:100px; font-family:sans-serif; color:#b91c1c;">
        <h2>Vadi E Kashmir</h2>
        <p>Fetching the latest news updates...</p>
        <div style="margin-top:20px;">
            <i class="fas fa-spinner fa-spin"></i>
        </div>
    </div>
</body>
</html>
