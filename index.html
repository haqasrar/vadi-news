<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vadi E Kashmir</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="ticker-wrap">
    <div class="ticker-content" id="ticker-box">Loading updates...</div>
</div>

<div id="main-content-area">

<header>
    <div class="header-top">
        <div class="brand-area">
            <img src="images/Logo.png" class="main-logo" alt="Logo">
            <div class="logo-text">VADI <span>E KASHMIR</span></div>
        </div>
        <button class="theme-btn" onclick="toggleTheme()">
            <i class="fas fa-moon"></i>
        </button>
    </div>

    <div class="nav-wrapper">
        <nav>
            <a onclick="filterNews('all')">Home</a>
            <a onclick="filterNews('J & K')">J & K</a>
            <a onclick="filterNews('Nation')">Nation</a>
            <a onclick="filterNews('Updates')">Updates</a>
            <a onclick="filterNews('Business')">Business</a>
        </nav>
    </div>
</header>

<div class="container">
<div class="layout-grid">

<main>
    <div class="magazine-hero">
        <div id="hero-main"></div>
    </div>

    <h2 class="section-title">Latest Headlines</h2>
    <div class="news-grid" id="news-grid"></div>
</main>

<aside>

<div class="sidebar-widget">
    <h3 class="widget-title">About Team</h3>

    <div class="profile-section">
        <img src="images/image.jpeg" class="profile-pic">
        <div class="profile-role">Founder</div>
        <div class="profile-name">Faisal Khan</div>
        <p class="profile-bio">Founder of Vadi-e-Kashmir</p>
        <div class="profile-socials">
            <a class="social-icon-btn fb-bg"><i class="fab fa-facebook-f"></i></a>
            <a class="social-icon-btn insta-bg"><i class="fab fa-instagram"></i></a>
            <a class="social-icon-btn tw-bg"><i class="fab fa-twitter"></i></a>
        </div>
    </div>

    <div class="profile-section">
        <img src="images/Asrar.jpg" class="profile-pic">
        <div class="profile-role">Developer</div>
        <div class="profile-name">Haq Asrar</div>
        <p class="profile-bio">Web & App Developer</p>
        <div class="profile-socials">
            <a class="social-icon-btn fb-bg"><i class="fab fa-facebook-f"></i></a>
            <a class="social-icon-btn insta-bg"><i class="fab fa-instagram"></i></a>
            <a class="social-icon-btn tw-bg"><i class="fab fa-twitter"></i></a>
        </div>
    </div>
</div>

</aside>
</div>
</div>

<footer>© 2022 Vadi E Kashmir</footer>
</div>

<!-- ARTICLE PAGE -->
<div id="article-page-view">
    <div class="article-wrapper">
        <div id="article-container"></div>
    </div>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
